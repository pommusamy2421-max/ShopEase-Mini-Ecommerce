<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ShopEase - Mini E-Commerce App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">🛍️ ShopEase</div>

        <button class="cart-btn" onclick="scrollToCart()">
            🛒 Cart (<span id="cart-count">0</span>)
        </button>
    </header>


    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to ShopEase</h1>
        <p>Simple shopping made easy.</p>
    </section>


    <!-- Products Section -->
    <section class="products-section">

        <h2>Our Products</h2>

        <!-- Products will be dynamically displayed here -->
        <div id="product-list" class="product-grid"></div>

    </section>


    <!-- Shopping Cart -->
    <section class="cart-section" id="cart-section">

        <h2>🛒 Shopping Cart</h2>

        <!-- Cart items will appear here -->
        <div id="cart-items">
            <p>Your cart is empty.</p>
        </div>

        <div class="cart-total">
            Total: ₹<span id="cart-total">0</span>
        </div>

        <button class="checkout-btn" onclick="openCheckout()">
            Proceed to Checkout
        </button>

    </section>


    <!-- Checkout Modal -->
    <div class="modal" id="checkout-modal">

        <div class="modal-content">

            <button class="close-btn" onclick="closeCheckout()">
                &times;
            </button>

            <h2>🧾 Checkout Preview</h2>

            <div id="checkout-items">
                <!-- Checkout items will appear here -->
            </div>

            <div class="modal-total">
                Total: ₹<span id="checkout-total">0</span>
            </div>

            <button class="confirm-btn" onclick="confirmOrder()">
                Confirm Order
            </button>

        </div>

    </div>


    <!-- Footer -->
    <footer>
        <p>© 2026 ShopEase | Interactive Mini E-Commerce App</p>
    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
